name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Check edited file length
        run: node .github/scripts/check-edited-file-lines.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: |
          set +e
          npm run format:check
          format_status=$?
          set -e

          if [ "$format_status" -ne 0 ]; then
            echo "::group::Files requiring Prettier formatting"
            npx prettier --list-different . || true
            echo "::endgroup::"
            exit "$format_status"
          fi

      - name: Lint
        run: npm run lint -- --format stylish

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build

      - name: Print validation context on failure
        if: failure()
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Commit: $GITHUB_SHA"
          echo "Changed files against master:"
          git diff --name-status origin/master...HEAD || true

  validation-diagnostics:
    name: Validation Diagnostics
    if: ${{ always() && needs.validate.result == 'failure' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Clone source quietly
        run: git clone --quiet --depth 1 --branch "$SOURCE_REF" "https://github.com/${SOURCE_REPOSITORY}.git" repo

      - name: Install dependencies quietly
        working-directory: repo
        run: npm ci --silent

      - name: Generate Prisma client quietly
        working-directory: repo
        run: npm run --silent db:generate

      - name: Frontend TypeScript diagnostics
        continue-on-error: true
        working-directory: repo
        run: npx tsc --noEmit -p tsconfig.json --pretty false

      - name: Server TypeScript diagnostics
        continue-on-error: true
        working-directory: repo
        run: npx tsc --noEmit -p tsconfig.server.json --pretty false

      - name: Formatting diagnostics
        continue-on-error: true
        working-directory: repo
        run: npx prettier --list-different .

      - name: Lint diagnostics
        continue-on-error: true
        working-directory: repo
        run: npm run lint -- --format stylish

      - name: Test diagnostics
        continue-on-error: true
        working-directory: repo
        run: npm test -- --reporter=verbose --bail=1

  docker-runtime:
    name: Docker Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --progress=plain -f docker/api/Dockerfile -t appsec-report-builder-api:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            --name appsec-report-builder-api \
            -p 3001:3001 \
            -e DATABASE_URL="file:/data/appsec-report-builder.db" \
            appsec-report-builder-api:${{ github.sha }}

      - name: Check API health
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3001/api/health; then
              exit 0
            fi

            echo "Waiting for API health check... attempt ${i}/20"
            sleep 2
          done

          echo "API health check failed"
          echo "::group::Container state"
          docker ps -a --filter name=appsec-report-builder-api
          docker inspect appsec-report-builder-api || true
          echo "::endgroup::"
          echo "::group::Container logs"
          docker logs appsec-report-builder-api || true
          echo "::endgroup::"
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop appsec-report-builder-api || true
          docker rm appsec-report-builder-api || true

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit policy
        run: |
          set +e
          npm run security:audit
          policy_status=$?
          set -e

          if [ "$policy_status" -ne 0 ]; then
            echo "::group::Detailed npm audit report"
            npm audit || true
            echo "::endgroup::"
            exit "$policy_status"
          fi
