name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Check edited file length
        run: node .github/scripts/check-edited-file-lines.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-runtime:
    name: Docker Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/api/Dockerfile -t appsec-report-builder-api:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            --name appsec-report-builder-api \
            -p 3001:3001 \
            -e DATABASE_URL="file:/data/appsec-report-builder.db" \
            appsec-report-builder-api:${{ github.sha }}

      - name: Check API health
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3001/api/health; then
              exit 0
            fi

            echo "Waiting for API health check..."
            sleep 2
          done

          echo "API health check failed"
          docker logs appsec-report-builder-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop appsec-report-builder-api || true
          docker rm appsec-report-builder-api || true

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit policy
        run: npm run security:audit

  report-for-ai:
    name: Report for AI
    if: ${{ always() && (needs.validate.result != 'success' || needs.docker-runtime.result != 'success' || needs.dependency-security.result != 'success') }}
    needs:
      - validate
      - docker-runtime
      - dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Prepare Report for AI
        run: mkdir -p "$RUNNER_TEMP/report-for-ai"

      - name: Install dependencies for diagnosis
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/report-for-ai/install.log"

      - name: Collect full diagnosis
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set +e
          set -o pipefail
          report_dir="$RUNNER_TEMP/report-for-ai"

          run_check() {
            id="$1"
            label="$2"
            shift 2

            echo "::group::$label"
            "$@" 2>&1 | tee "$report_dir/$id.log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            printf '%s\n' "$status" > "$report_dir/$id.status"
          }

          formatting_check() {
            npm run format:check
            status=$?

            if [ "$status" -ne 0 ]; then
              echo
              echo "Files requiring formatting:"
              npx prettier --list-different . || true
            fi

            return "$status"
          }

          dependency_check() {
            npm run security:audit
            status=$?

            if [ "$status" -ne 0 ]; then
              echo
              echo "Full npm audit output:"
              npm audit || true
            fi

            return "$status"
          }

          docker_check() {
            image="appsec-report-builder-ai:${GITHUB_SHA}"
            container="report-for-ai-${GITHUB_RUN_ID}"

            docker rm -f "$container" >/dev/null 2>&1 || true
            docker build --progress=plain -f docker/api/Dockerfile -t "$image" . || return $?
            docker run -d \
              --name "$container" \
              -p 3001:3001 \
              -e DATABASE_URL="file:/data/appsec-report-builder.db" \
              "$image" || return $?

            for i in {1..20}; do
              if curl -fsS http://localhost:3001/api/health; then
                docker rm -f "$container" >/dev/null 2>&1 || true
                return 0
              fi

              echo "Waiting for API health check, attempt ${i}/20"
              sleep 2
            done

            echo "Container state:"
            docker ps -a --filter "name=$container" || true
            echo "Container inspection:"
            docker inspect "$container" || true
            echo "Container logs:"
            docker logs "$container" || true
            docker rm -f "$container" >/dev/null 2>&1 || true
            return 1
          }

          run_check edited-file-length "Edited file length" \
            node .github/scripts/check-edited-file-lines.mjs
          run_check prisma-validate "Prisma schema" \
            npm run db:validate
          run_check prisma-generate "Prisma client generation" \
            npm run db:generate
          run_check formatting "Formatting" formatting_check
          run_check lint "Lint" \
            npm run lint -- --format stylish
          run_check typecheck-frontend "Frontend TypeScript" \
            npx tsc --noEmit -p tsconfig.json --pretty false
          run_check typecheck-server "Server TypeScript" \
            npx tsc --noEmit -p tsconfig.server.json --pretty false
          run_check tests-frontend "Frontend tests" \
            npm run test:frontend -- --reporter=verbose
          run_check tests-backend "Backend tests" \
            npm run test:backend -- --reporter=verbose
          run_check build-client "Client build" \
            npm run build:client
          run_check build-server "Server build" \
            npm run build:server
          run_check dependency-security "Dependency security" dependency_check
          run_check docker-runtime "Docker runtime" docker_check

          exit 0

      - name: Create Report for AI summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ORIGINAL_VALIDATE: ${{ needs.validate.result }}
          ORIGINAL_DOCKER: ${{ needs.docker-runtime.result }}
          ORIGINAL_DEPENDENCIES: ${{ needs.dependency-security.result }}
        run: |
          report_dir="$RUNNER_TEMP/report-for-ai"
          report="$report_dir/report-for-ai.md"
          mkdir -p "$report_dir"

          checks=(
            "edited-file-length|Edited file length"
            "prisma-validate|Prisma schema"
            "prisma-generate|Prisma client generation"
            "formatting|Formatting"
            "lint|Lint"
            "typecheck-frontend|Frontend TypeScript"
            "typecheck-server|Server TypeScript"
            "tests-frontend|Frontend tests"
            "tests-backend|Backend tests"
            "build-client|Client build"
            "build-server|Server build"
            "dependency-security|Dependency security"
            "docker-runtime|Docker runtime"
          )

          {
            echo "# Report for AI"
            echo
            echo "This is an additional, non-blocking diagnostic job. The original CI jobs remain unchanged and remain the source of truth."
            echo "Every available diagnostic continues after failures so one run exposes the complete repair list."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- Complete raw logs: artifact \`report-for-ai-${GITHUB_RUN_ID}\`"
            echo
            echo "## Original CI results"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Validate | $ORIGINAL_VALIDATE |"
            echo "| Docker Runtime | $ORIGINAL_DOCKER |"
            echo "| Dependency Security | $ORIGINAL_DEPENDENCIES |"
            echo
            echo "## Full diagnostic pass"
            echo
            echo "| Diagnostic | Result | Exit code |"
            echo "| --- | --- | --- |"
          } > "$report"

          if [ "$INSTALL_OUTCOME" = "success" ]; then
            echo "| Install dependencies | PASS | 0 |" >> "$report"
          else
            echo "| Install dependencies | FAIL | unavailable |" >> "$report"
            {
              echo
              echo "## Install dependencies"
              echo
              echo '```text'
              tail -n 120 "$report_dir/install.log" 2>/dev/null || echo "No log was produced."
              echo '```'
            } >> "$report"
          fi

          for entry in "${checks[@]}"; do
            IFS='|' read -r id label <<< "$entry"
            status_file="$report_dir/$id.status"
            log_file="$report_dir/$id.log"

            if [ -f "$status_file" ]; then
              status="$(cat "$status_file")"
            else
              status="not-run"
            fi

            if [ "$status" = "0" ]; then
              result="PASS"
            elif [ "$status" = "not-run" ]; then
              result="NOT RUN"
            else
              result="FAIL"
            fi

            echo "| $label | $result | $status |" >> "$report"

            if [ "$result" = "FAIL" ]; then
              {
                echo
                echo "## $label failure"
                echo
                echo "The final 120 lines are shown here. The artifact contains the complete raw log."
                echo
                echo '```text'
                tail -n 120 "$log_file" 2>/dev/null || echo "No log was produced."
                echo '```'
              } >> "$report"
            fi
          done

          {
            echo
            echo "## Changed files"
            echo
            echo '```text'
            git diff --name-status origin/master...HEAD || true
            echo '```'
          } >> "$report"

          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete Report for AI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-for-ai-${{ github.run_id }}
          path: ${{ runner.temp }}/report-for-ai
          if-no-files-found: warn
          retention-days: 7
