name: PR 381 Prettier Probe

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    name: Export Prettier output
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format target files
        run: |
          npx prettier --write \
            src/app/appRouter.tests/supportAppRouter.ts \
            src/app/appRouter.vitest.test.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: pr381-prettier-output
          path: |
            src/app/appRouter.tests/supportAppRouter.ts
            src/app/appRouter.vitest.test.tsx
          if-no-files-found: error
          retention-days: 1
