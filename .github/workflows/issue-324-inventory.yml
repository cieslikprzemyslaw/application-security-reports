name: Issue 324 Apply Patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    name: Apply and validate Assessment taxonomy patch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/324-tighten-assessment-owasp-version-typing
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Apply idempotent patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding='utf-8')

          def replace_or_present(path: str, old: str, new: str, count: int = 1) -> None:
              content = read(path)
              if new in content:
                  return
              actual = content.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} old matches, found {actual}')
              write(path, content.replace(old, new))

          def regex_replace_or_present(
              path: str,
              pattern: str,
              replacement: str,
              present: str,
          ) -> None:
              content = read(path)
              if present in content:
                  return
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: structural pattern did not match')
              write(path, updated)

          replace_or_present(
              'src/app/pages/assessmentDetails/hooks/useAssessmentFindings.ts',
              "import { OWASP_TOP_10_CURRENT_VERSION } from '~/domain';",
              "import {\n  OWASP_TOP_10_CURRENT_VERSION,\n  type OwaspTop10Version,\n} from '~/domain';",
          )
          replace_or_present(
              'src/app/pages/assessmentDetails/hooks/useAssessmentFindings.ts',
              '  assessmentOwaspTaxonomyVersion?: string;',
              '  assessmentOwaspTaxonomyVersion?: OwaspTop10Version;',
          )

          replace_or_present(
              'src/app/pages/assessmentDetails/components/assessmentFindingsSection.component.tsx',
              "import { OWASP_TOP_10_CURRENT_VERSION } from '~/domain';\n\n",
              '',
          )
          replace_or_present(
              'src/app/pages/assessmentDetails/components/assessmentFindingsSection.component.tsx',
              '  const owaspTaxonomyVersion =\n    assessment.owaspTaxonomyVersion ?? OWASP_TOP_10_CURRENT_VERSION;',
              '  const { owaspTaxonomyVersion } = assessment;',
          )

          test_utils = 'src/app/pages/assessmentDetails/components/assessmentFindingsSection.testUtils.tsx'
          content = read(test_utils)
          old_fallback = 'assessment.owaspTaxonomyVersion ?? OWASP_TOP_10_CURRENT_VERSION'
          if old_fallback in content:
              if content.count(old_fallback) != 3:
                  raise SystemExit(f'{test_utils}: unexpected fallback count')
              write(test_utils, content.replace(old_fallback, 'assessment.owaspTaxonomyVersion'))

          threat_route = 'server/routes/threats.route.ts'
          content = read(threat_route)
          if 'assessment.owaspTaxonomyVersion!' in content:
              if content.count('assessment.owaspTaxonomyVersion!') != 4:
                  raise SystemExit(f'{threat_route}: unexpected assertion count')
              write(
                  threat_route,
                  content.replace(
                      'assessment.owaspTaxonomyVersion!',
                      'assessment.owaspTaxonomyVersion',
                  ),
              )

          schema_test = 'src/domain/schemas/assessment.schema.vitest.test.ts'
          missing_test_title = 'rejects a persisted assessment without an OWASP taxonomy version'
          content = read(schema_test)
          if missing_test_title not in content:
              anchor = "  it('accepts a historical null application name', () => {"
              if anchor not in content:
                  raise SystemExit(f'{schema_test}: insertion anchor missing')
              test = """  it('rejects a persisted assessment without an OWASP taxonomy version', () => {
            const {
              owaspTaxonomyVersion: omittedVersion,
              ...assessmentWithoutVersion
            } = validPersistedAssessment;
            void omittedVersion;

            const result = assessmentSchema.safeParse(assessmentWithoutVersion);

            expectInvalidAt(result, ['owaspTaxonomyVersion']);
          });

          """
              write(schema_test, content.replace(anchor, test + anchor, 1))

          service_test = 'src/services/services.assessment.vitest.test.ts'
          replace_or_present(
              service_test,
              "import assert from 'node:assert/strict';\n\n",
              "import assert from 'node:assert/strict';\n\nimport { OWASP_TOP_10_CURRENT_VERSION } from '~/domain';\n\n",
          )
          replace_or_present(
              service_test,
              "import type { ApiRequestOptions } from './apiClient.js';",
              "import {\n  ApiResponseParseError,\n  type ApiRequestOptions,\n} from './apiClient.js';",
          )
          content = read(service_test)
          if 'owaspTaxonomyVersion: OWASP_TOP_10_CURRENT_VERSION' not in content:
              anchor = "      overallRisk: 'high',\n"
              if content.count(anchor) != 1:
                  raise SystemExit(f'{service_test}: fixture anchor missing')
              write(
                  service_test,
                  content.replace(
                      anchor,
                      anchor + '      owaspTaxonomyVersion: OWASP_TOP_10_CURRENT_VERSION,\n',
                      1,
                  ),
              )
          content = read(service_test)
          if 'assessmentWithoutVersion' not in content:
              anchor = "    {\n      const input: AssessmentCreateInput = {"
              if anchor not in content:
                  raise SystemExit(f'{service_test}: negative-test anchor missing')
              tests = """    {
            const {
              owaspTaxonomyVersion: omittedVersion,
              ...assessmentWithoutVersion
            } = assessment;
            void omittedVersion;
            const { request } = createRequestSpy({ data: assessmentWithoutVersion });
            const service = createAssessmentService(request);

            await assert.rejects(
              () => service.getById(assessment.id),
              ApiResponseParseError,
            );
          }

          {
            const { request } = createRequestSpy({
              data: {
                ...assessmentOverview,
                assessment: {
                  ...assessmentOverview.assessment,
                  owaspTaxonomyVersion: '2099',
                },
              },
            });
            const service = createAssessmentService(request);

            await assert.rejects(
              () => service.getOverview(company.id, assessment.id),
              ApiResponseParseError,
            );
          }

          """
              write(service_test, content.replace(anchor, tests + anchor, 1))

          service = 'src/services/assessmentService.ts'
          replace_or_present(
              service,
              "import type {\n  Assessment,",
              "import { z } from 'zod';\n\nimport type {\n  Assessment,",
          )
          replace_or_present(
              service,
              "} from '~/domain';\n\nimport { apiRequest } from './apiClient.js';",
              "} from '~/domain';\nimport {\n  assessmentSchema,\n  nonEmptyIdSchema,\n  nonEmptyTextSchema,\n  nonNegativeIntegerSchema,\n} from '~/domain/schemas';\n\nimport { ApiResponseParseError, apiRequest } from './apiClient.js';",
          )

          command_schema = """export const assessmentWorkspaceCommands = [
            'start',
            'complete',
            'reopen',
            'archive',
          ] as const;

          export type AssessmentWorkspaceCommand =
            (typeof assessmentWorkspaceCommands)[number];

          const assessmentWorkspaceCommandSchema = z.enum(
            assessmentWorkspaceCommands,
          );
          const assessmentWorkspaceCompanySchema = z
            .object({
              id: nonEmptyIdSchema,
              name: nonEmptyTextSchema,
            })
            .strict();

          export const assessmentWorkspaceOverviewSchema = z
            .object({
              company: assessmentWorkspaceCompanySchema,
              assessment: assessmentSchema
                .extend({
                  recordVersion: nonNegativeIntegerSchema,
                  findingsCount: nonNegativeIntegerSchema,
                  evidenceCount: nonNegativeIntegerSchema,
                  reportVersionCount: nonNegativeIntegerSchema,
                  testerName: nonEmptyTextSchema.optional(),
                  availableActions: z
                    .array(assessmentWorkspaceCommandSchema)
                    .optional(),
                })
                .strict(),
            })
            .strict();

          const parseAssessmentResponse = (
            response: unknown,
            message: string,
          ): Assessment => {
            const parsed = assessmentSchema.safeParse(response);

            if (!parsed.success) {
              throw new ApiResponseParseError(message);
            }

            return parsed.data;
          };

          const parseAssessmentWorkspaceOverview = (
            response: unknown,
            message: string,
          ): AssessmentWorkspaceOverview => {
            const parsed = assessmentWorkspaceOverviewSchema.safeParse(response);

            if (!parsed.success) {
              throw new ApiResponseParseError(message);
            }

            return parsed.data;
          };"""
          regex_replace_or_present(
              service,
              r"export type AssessmentWorkspaceCommand =\n  \| 'start'\n  \| 'complete'\n  \| 'reopen'\n  \| 'archive';",
              command_schema,
              'export const assessmentWorkspaceCommands = [',
          )

          run_command = """const runAssessmentCommand = async (
            request: ApiRequestFn,
            companyId: string,
            assessmentId: string,
            command: AssessmentWorkspaceCommand,
            recordVersion: number,
            signal?: AbortSignal,
          ) => {
            const response = await requestData<unknown>(
              request,
              buildWorkspaceAssessmentUrl(companyId, assessmentId, `commands/${command}`),
              {
                body: { recordVersion },
                method: 'POST',
                signal,
              },
            );

            return parseAssessmentWorkspaceOverview(
              response,
              'Unable to validate the Assessment command response.',
            );
          };"""
          regex_replace_or_present(
              service,
              r"const runAssessmentCommand = \([\s\S]*?\n  \);(?=\n\nexport interface AssessmentService)",
              run_command,
              'const runAssessmentCommand = async (',
          )

          get_by_id = """  async getById(assessmentId, signal) {
            const response = await requestData<unknown>(
              request,
              `/api/assessments/${assessmentId}`,
              {
                method: 'GET',
                signal,
              },
            );

            return parseAssessmentResponse(
              response,
              'Unable to validate the Assessment response.',
            );
          },

          """
          regex_replace_or_present(
              service,
              r"  async getById\(assessmentId, signal\) \{[\s\S]*?\n  \},\n\n(?=  async getOverview)",
              get_by_id,
              "'Unable to validate the Assessment response.'",
          )

          overview = """  async getOverview(companyId, assessmentId, signal) {
            const response = await requestData<unknown>(
              request,
              buildWorkspaceAssessmentUrl(companyId, assessmentId, 'overview'),
              {
                method: 'GET',
                signal,
              },
            );

            return parseAssessmentWorkspaceOverview(
              response,
              'Unable to validate the Assessment overview response.',
            );
          },

          """
          regex_replace_or_present(
              service,
              r"  async getOverview\(companyId, assessmentId, signal\) \{[\s\S]*?\n  \},\n\n(?=  async create)",
              overview,
              "'Unable to validate the Assessment overview response.'",
          )

          create = """  async create(input) {
            const response = await requestData<unknown>(request, '/api/assessments', {
              body: input,
              method: 'POST',
            });

            return parseAssessmentResponse(
              response,
              'Unable to validate the created Assessment response.',
            );
          },

          """
          regex_replace_or_present(
              service,
              r"  async create\(input\) \{[\s\S]*?\n  \},\n\n(?=  async update)",
              create,
              "'Unable to validate the created Assessment response.'",
          )

          update = """  async update(assessmentId, input) {
            const response = await requestData<unknown>(
              request,
              `/api/assessments/${assessmentId}`,
              {
                body: input,
                method: 'PATCH',
              },
            );

            return parseAssessmentResponse(
              response,
              'Unable to validate the updated Assessment response.',
            );
          },

          """
          regex_replace_or_present(
              service,
              r"  async update\(assessmentId, input\) \{[\s\S]*?\n  \},\n\n(?=  async start)",
              update,
              "'Unable to validate the updated Assessment response.'",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/app/pages/assessmentDetails/hooks/useAssessmentFindings.ts \
            src/app/pages/assessmentDetails/components/assessmentFindingsSection.component.tsx \
            src/app/pages/assessmentDetails/components/assessmentFindingsSection.testUtils.tsx \
            server/routes/threats.route.ts \
            src/domain/schemas/assessment.schema.vitest.test.ts \
            src/services/assessmentService.ts \
            src/services/services.assessment.vitest.test.ts

      - name: Run mandatory typecheck
        run: npm run typecheck

      - name: Run focused tests
        run: |
          npm test -- \
            src/domain/schemas/assessment.schema.vitest.test.ts \
            src/services/services.assessment.vitest.test.ts

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/pages/assessmentDetails/hooks/useAssessmentFindings.ts \
            src/app/pages/assessmentDetails/components/assessmentFindingsSection.component.tsx \
            src/app/pages/assessmentDetails/components/assessmentFindingsSection.testUtils.tsx \
            server/routes/threats.route.ts \
            src/domain/schemas/assessment.schema.vitest.test.ts \
            src/services/assessmentService.ts \
            src/services/services.assessment.vitest.test.ts
          git commit -m "refactor: validate Assessment taxonomy responses" \
            -m "Signed-off-by: Przemyslaw Cieslik <cieslikprzemyslaw@users.noreply.github.com>"
          git push origin HEAD:refactor/324-tighten-assessment-owasp-version-typing
