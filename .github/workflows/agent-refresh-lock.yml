name: Agent Refresh Lock

on:
  push:
    branches:
      - agent/stabilize-collection-states

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.head_commit.message != 'Refresh lockfile and verify audit'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-collection-states
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Format repository
        run: npm run format

      - name: Capture fixed audit report
        run: npm audit --json > .agent-audit-fixed.json || true

      - name: Remove diagnostics and workflow
        run: |
          rm -f .agent-audit.json
          rm .github/workflows/agent-refresh-lock.yml

      - name: Commit lockfile result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh lockfile and verify audit"
          git push --no-verify origin HEAD:agent/stabilize-collection-states
