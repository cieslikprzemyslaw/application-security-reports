name: Temporary CWE source recovery

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reassemble implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "c0d563a197818322e6a1ceb213314bd4cf0435ce7f720cb3d56492dd4e8cafaf  .agent/patch.part.00" | sha256sum --check
          echo "a29d58e20904743b9dbdea354b006e4391c777fd782da03f78898104d5d5e0d0  .agent/patch.part.01" | sha256sum --check
          echo "10612ab1c20991fecce5c4859bdeb6b934e75297efc21ab0eb2c1361f365b949  .agent/patch.part.02" | sha256sum --check
          echo "83740e520285f6848fa697551e792e6a267c2b01e0fddb9f7352b58c4b56995a  .agent/patch.part.03" | sha256sum --check
          echo "7c5e3226498a0946c18514e078adec5e863c06d3a4c920a55c797d3226b498b2  .agent/patch.part.04" | sha256sum --check
          echo "fa8a01e140a64dae254acec86421d1d7f39174bed671db5675a523d0c4c922dc  .agent/patch.part.05" | sha256sum --check
          cat .agent/patch.part.* > /tmp/cwe-final.patch.gz.b64
          base64 --decode /tmp/cwe-final.patch.gz.b64 > /tmp/cwe-final.patch.gz
          echo "1e76dc7c4e33599f157f937fe88f2d9c9f0ae0586e404c2460a15dffa9007c51  /tmp/cwe-final.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/cwe-final.patch.gz > /tmp/cwe-final.patch
          echo "bc9158eefa98ca4b8ecb2eef0416a27b478d3f3738188a87c6b71eea68b47d4c  /tmp/cwe-final.patch" | sha256sum --check
          git apply --check /tmp/cwe-final.patch
          git apply /tmp/cwe-final.patch
          rm -rf .agent
          rm -f .github/workflows/agent-source-export.yml
          git diff --check
          tar --exclude=.git -czf /tmp/cwe-complete-source.tar.gz .
          sha256sum /tmp/cwe-complete-source.tar.gz > /tmp/cwe-complete-source.sha256

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: cwe-complete-source
          path: |
            /tmp/cwe-complete-source.tar.gz
            /tmp/cwe-complete-source.sha256
          retention-days: 1
