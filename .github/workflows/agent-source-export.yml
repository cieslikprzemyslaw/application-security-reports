name: Agent apply CWE implementation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Apply prepared implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent/cwe-final.patch.gz.b64 | gzip --decompress > /tmp/cwe-final.patch
          echo "bc9158eefa98ca4b8ecb2eef0416a27b478d3f3738188a87c6b71eea68b47d4c  /tmp/cwe-final.patch" | sha256sum --check
          git apply --check /tmp/cwe-final.patch
          git apply /tmp/cwe-final.patch
          rm -rf .agent
          rm -f .github/workflows/agent-source-export.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Validate implementation
        run: npm run validate

      - name: Validate dependency policy
        run: npm run security:audit

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add end-to-end CWE support"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
