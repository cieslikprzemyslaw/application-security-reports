name: Agent source export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Upload Node runtime
        uses: actions/upload-artifact@v4
        with:
          name: agent-node-24-${{ github.event.pull_request.head.sha }}
          path: /opt/hostedtoolcache/node/24.15.0/x64
          include-hidden-files: true
          retention-days: 1
