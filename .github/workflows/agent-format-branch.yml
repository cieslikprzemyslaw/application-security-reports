name: Agent Format Branch

on:
  push:
    branches:
      - agent/stabilize-collection-states

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply repository formatting'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-collection-states
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Remove one-time workflow
        run: rm .github/workflows/agent-format-branch.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply repository formatting"
          git push --no-verify origin HEAD:agent/stabilize-collection-states
